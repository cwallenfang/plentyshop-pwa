name: coverage
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      available: ${{ steps.coverage-files.outputs.available }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the validated npm version
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test:coverage
      - name: Check coverage files
        id: coverage-files
        if: ${{ !cancelled() }}
        run: |
          if [[ -f apps/web/coverage/coverage-summary.json && -f apps/web/coverage/coverage-final.json ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload coverage
        if: ${{ !cancelled() && steps.coverage-files.outputs.available == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pull-request
          path: apps/web/coverage

  coverage-base:
    # Historical base branches need not pass installation/tests in a new fork.
    if: github.repository == 'plentymarkets/plentyshop-pwa' || vars.ENABLE_COVERAGE_COMPARISON == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          repository: ${{ github.event.pull_request.base.repo.full_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the validated npm version
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Test base
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-base
          path: apps/web/coverage
          if-no-files-found: error

  coverage-report:
    needs: [coverage-test, coverage-base]
    if: ${{ !cancelled() && needs.coverage-test.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-pull-request
          path: coverage
      - name: Download optional comparison
        id: comparison
        if: needs.coverage-base.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-base
          path: coverage-base
      - name: Report coverage in the job summary
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          vite-config-path: apps/web/vitest.config.ts
          comment-on: none
          threshold-icons: "{0: '🔴', 80: '🟠', 90: '🟢'}"
          json-summary-compare-path: ${{ steps.comparison.outcome == 'success' && 'coverage-base/coverage-summary.json' || '' }}
