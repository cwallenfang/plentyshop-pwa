name: Windows Build
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - meinelampe

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup

      - name: Set environment for compilation (no live shop required)
        run: |
          @(
            'API_ENDPOINT=https://shop.invalid'
            'FETCH_REMOTE_CONFIG=0'
            'DEFAULTLANGUAGE=en'
            'LANGUAGELIST=en,de'
          ) | Set-Content -Path apps/web/.env
        shell: pwsh

      - name: Build app
        run: |
          npm run build
