name: 'Weekly sonar qube scan'
on:
  schedule:
    # Every Sunday at 10 PM UTC
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  base_branch: ${{ github.event.repository.default_branch }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    if: github.repository == 'plentymarkets/plentyshop-pwa' || vars.ENABLE_SONAR == 'true'
    name: Scan Code
    runs-on: ubuntu-latest

    steps:
      - name: Check SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_HOST_URL" || -z "$SONAR_PROJECT_KEY" ]]; then
            echo "::error::Set SONAR_TOKEN, SONAR_HOST_URL and SONAR_PROJECT_KEY before enabling SonarQube."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          path: .
          fetch-depth: 0
          ref: ${{ env.base_branch }}
      - name: Setup Node
        uses: ./.github/actions/setup

      - name: 'Test'
        continue-on-error: true
        run: npm run test:coverage

      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.branch.name=${{ env.base_branch }}
            -Dsonar.sources=apps/web
            -Dsonar.exclusions=**/__tests__/**,.nuxt/**,.output/**,.env
            -Dsonar.tests=apps/web
            -Dsonar.test.inclusions=**/__tests__/**
            -Dsonar.javascript.lcov.reportPaths=./apps/web/coverage/lcov.info
            -Dsonar.scanner.socketTimeout=1800
