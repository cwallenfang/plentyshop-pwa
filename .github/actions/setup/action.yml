name: 'Setup Node'
description: 'The default Node setup for all workflows'
runs:
  using: 'composite'
  steps:
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
    - name: Use the validated npm version
      run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      shell: bash
    - name: Install dependencies
      run: npm ci
      shell: bash
    - name: Sym link .claude to .github
      run: npm run llm:link github
      shell: bash
